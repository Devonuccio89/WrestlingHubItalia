# WrestlingHub Italia - aggiornamento e pubblicazione automatica.
# Ogni 30 minuti (e a ogni modifica caricata su GitHub): scarica le notizie,
# rigenera guide/eventi e pubblica su Cloudflare Pages. Non modifica il repository.
# Segreti richiesti (GitHub > Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  - token con permesso "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID - ID dell'account Cloudflare
name: Aggiorna e pubblica

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Lo storico delle notizie (data/news.json) vive nella cache di GitHub Actions,
      # cosi' l'automazione non modifica mai il repository (niente conflitti con GitHub Desktop).
      - name: Recupera lo storico delle notizie
        uses: actions/cache/restore@v4
        with:
          path: data/news.json
          key: news-${{ github.run_id }}
          restore-keys: news-

      - name: Aggiorna le notizie
        shell: pwsh
        run: ./aggiorna.ps1

      - name: Salva lo storico delle notizie
        uses: actions/cache/save@v4
        with:
          path: data/news.json
          key: news-${{ github.run_id }}

      - name: Genera guide e schede evento
        shell: pwsh
        run: ./genera-guide.ps1

      - name: Prepara i file del sito
        run: |
          mkdir -p dist/data
          cp *.html ads.txt robots.txt sitemap.xml dist/
          cp -r assets guide eventi dist/
          cp data/*.js dist/data/

      - name: Pubblica su Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create wrestlinghubitalia --production-branch=main || true
          npx --yes wrangler@4 pages deploy dist --project-name=wrestlinghubitalia --branch=main --commit-dirty=true
