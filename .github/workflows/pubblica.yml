# WrestlingHub Italia - aggiornamento e pubblicazione automatica.
# Ogni 30 minuti (e a ogni modifica caricata su GitHub): scarica le notizie,
# rigenera guide/eventi, salva i dati nel repository e pubblica su Cloudflare Pages.
# Segreti richiesti (GitHub > Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  - token con permesso "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID - ID dell'account Cloudflare
name: Aggiorna e pubblica

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Aggiorna le notizie
        shell: pwsh
        run: ./aggiorna.ps1

      - name: Genera guide e schede evento
        shell: pwsh
        run: ./genera-guide.ps1

      - name: Salva i dati aggiornati nel repository
        run: |
          git config user.name "wrestlinghub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data guide eventi sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
          else
            git commit -m "Aggiornamento automatico notizie"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Prepara i file del sito
        run: |
          mkdir -p dist/data
          cp *.html ads.txt robots.txt sitemap.xml dist/
          cp -r assets guide eventi dist/
          cp data/*.js dist/data/

      - name: Pubblica su Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create wrestlinghubitalia --production-branch=main || true
          npx --yes wrangler@4 pages deploy dist --project-name=wrestlinghubitalia --branch=main --commit-dirty=true
